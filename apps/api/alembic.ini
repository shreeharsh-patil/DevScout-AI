# Alembic configuration for DevScout AI
#
# For general usage:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is read from the DATABASE_URL environment variable
# at runtime via env.py.  This placeholder is only used by `alembic history`.
# Override it with:  alembic -x sqlalchemy.url=postgresql://... upgrade head
sqlalchemy.url = sqlite:///./devscout.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
